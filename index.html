<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoSlayer</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="menu">
      <h1 class="title">GeoSlayer</h1>
      <div class="currency-box">
        <p class="currency"></p>
      </div>
    </div>
    <div class="arena">
      <div class="wave-stage-box">
        <!-- Licznik przeciwników i poziomów  -->
        <p class="enemy-wave"></p>
        <p class="enemy-stage"></p>
      </div>
      <!-- Pasek życia przeciwnika -->
      <div class="hp-bar">
        <div class="hp-status"></div>
        <p class="hp-number"></p>
      </div>
      <!-- Przeciwnik  -->
      <p class="enemy-name">Enemy</p>
      <div class="enemy"></div>
      <!-- Bohater  -->
      <div class="hero"></div>
      <!-- Pasek życia bohatera -->
      <div class="hero-hp">
        <div class="hp-bar">
          <div class="hp-status"></div>
          <p class="hp-number"></p>
        </div>
      </div>
    </div>
    <div class="upgrades">
      <button class="dmg-upgrade"></button>
    </div>
    <div class="komunikat komunikat-hidden">
      <div class="komunikat-box">
        <h2>Porażka</h2>
        <p>
          Zostałeś pokonany. Teraz zostaniesz przeniesiony do pierwszego
          przeciwnika w tym etapie, ale zachowasz swój progres. Chcesz przejść
          dalej? Odradzaj się, stawaj się silniejszy i pędź do przodu!
        </p>
        <label>
          <input type="checkbox" class="komunikat-check" />
          Nie pokazuj ponownie
        </label>
        <button class="komunikat-ok">OK</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
